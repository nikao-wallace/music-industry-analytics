version: 2

models:
  - name: stg_artists
    description: Cleaned and standardized artist records from the raw source.
    columns:
      - name: artist_id
        description: Unique identifier for the artist.
        data_tests:
          - not_null
          - unique

      - name: artist_name
        description: Name of the artist.
        data_tests:
          - not_null

      - name: genre
        description: Detailed source genre of the artist.
        data_tests:
          - not_null

      - name: genre_group
        description: Standardized broad genre classification.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Pop
                  - Rock
                  - Hip-Hop
                  - Electronic
                  - R&B
                  - Country
                  - Folk
                  - World
                  - Other

      - name: signed_date
        description: Date the artist signed with the label.
        data_tests:
          - not_null

      - name: artist_status
        description: Current status of the artist.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - active
                  - inactive



  - name: stg_tracks
    description: Cleaned and standardized track records from the raw source.
    columns:
      - name: track_id
        description: Unique identifier for the track.
        data_tests:
          - not_null
          - unique

      - name: artist_id
        description: Unique identifier for the artist associated with the track.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_artists')
                field: artist_id

      - name: track_name
        description: Name of the track.
        data_tests:
          - not_null

      - name: duration_ms
        description: Duration of the track in milliseconds.
        data_tests:
          - not_null
          

      - name: release_date
        description: Release date of the track.
        data_tests:
          - not_null

  - name: stg_stream_events
    description: Cleaned and standardized streaming event records from the raw source.
    columns:
      - name: stream_id
        description: Unique identifier for the streaming event.
        data_tests:
          - not_null
          - unique

      - name: track_id
        description: Unique identifier for the track associated with the streaming event.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tracks')
                field: track_id

      - name: listener_id
        description: Identifier for the listener associated with the streaming event.
        data_tests:
          - not_null

      - name: stream_timestamp
        description: Timestamp of when the streaming event occurred.
        data_tests:
          - not_null

      - name: ms_played
        description: Duration of the stream in milliseconds.
        data_tests:
          - not_null

      - name: streaming_platform
        description: Platform on which the track was streamed.
        data_tests:
          - not_null

      - name: device_type
        description: Type of device used for streaming.
        data_tests:
          - not_null

      - name: country
        description: Country from which the streaming event originated.
        data_tests:
          - not_null

      - name: stream_source
        description: Source of the streaming event (e.g., playlist, radio, direct).
        data_tests:
          - not_null