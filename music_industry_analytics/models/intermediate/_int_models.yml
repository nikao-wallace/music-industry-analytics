version: 2

models:
  - name: int_artist_listener_first_stream
    description: First streaming event for each artist and listener combination.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - artist_id
              - listener_id

    columns:
      - name: artist_id
        data_tests:
          - not_null

      - name: listener_id
        data_tests:
          - not_null

      - name: first_stream_timestamp
        data_tests:
          - not_null

  - name: int_new_listeners_monthly
    description: Monthly count of new listeners for each artist.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - artist_id
              - month 

    columns:
      - name: artist_id
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

  - name: int_artists_monthly
    description: Monthly metrics for each artist, including total streams, unique listeners, and new listeners.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - artist_id
              - month 

    columns:
      - name: artist_id
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null  
        
      - name: streams_per_listener
        description: Average number of streams per listener for the artist in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

      - name: total_streams
        description: Total number of streams for the artist in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

      - name: unique_listeners
        description: Total number of unique listeners for the artist in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

      - name: total_ms_played
        description: Total milliseconds played for the artist in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

      - name: repeat_listener_rate
        description: Percentage of listeners who streamed the artist more than once in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0 and repeat_listener_rate <= 1"

  - name: int_engagements_monthly
    description: Monthly engagement metrics for each artist, including total engagements and unique engagers.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - artist_id
              - month 

    columns:
      - name: artist_id
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null  
        
      - name: total_engagements
        description: Total number of engagements for the artist in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

      - name: shares 
        description: Total number of shares for the artist in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

      - name: saves 
        description: Total number of saves for the artist in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

      - name: playlist_adds 
        description: Total number of playlist adds for the artist in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

  - name: int_campaigns_monthly
    description: Monthly campaign metrics for each artist, including total campaigns and unique campaign participants.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - campaign_month 

    columns:
      - name: campaign_id
        data_tests:
          - not_null

      - name: campaign_month
        data_tests:
          - not_null  
        
      - name: active_days
        description: Total number of active days for the campaign in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"

      - name: allocated_spend
        description: Total allocated spend for the campaign in the given month.
        data_tests:
           - dbt_utils.expression_is_true:
                arguments:
                  expression: ">= 0"